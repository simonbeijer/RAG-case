[project]
name = "rag-case"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
